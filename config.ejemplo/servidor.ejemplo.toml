# Copia este fichero a config/servidor.toml y ajústalo.

[servidor]
host = "127.0.0.1"
port = 8000

[base_datos]
# PostgreSQL 14 o superior
url = "postgresql://alfred:CAMBIAME@localhost:5432/alfred"

[almacenamiento]
zona_temporal = "datos/temporal"

[trabajos]
# Cuántos trabajos pueden correr a la vez según el peso declarado por el minijob
max_ligeros = 4
max_pesados = 1
# Segundos que se espera a que un minijob pare por las buenas antes de cortarlo
gracia_cancelacion_s = 10
