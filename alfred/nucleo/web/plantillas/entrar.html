{% extends "base.html" %}
{% block contenido %}
<h1>Entrar</h1>
{% if sin_admin %}
  <p class="aviso">Todavía no hay administrador. En el servidor, ejecuta:<br>
  <code>python -m alfred.nucleo.usuarios crear</code></p>
{% endif %}
{% if error %}<p class="aviso" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/entrar">
  <input type="hidden" name="siguiente" value="{{ siguiente }}">
  <div class="campo"><label for="usuario"><strong>Usuario</strong></label><br>
    <input id="usuario" name="usuario" autocomplete="username" autofocus required></div>
  <div class="campo"><label for="clave"><strong>Contraseña</strong></label><br>
    <input id="clave" name="clave" type="password" autocomplete="current-password" required></div>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
