# Copia este fichero a config/servidor.toml y ajústalo.

[servidor]
host = "127.0.0.1"
port = 8000

[base_datos]
# PostgreSQL 14 o superior
url = "postgresql://alfred:CAMBIAME@localhost:5432/alfred"

[almacenamiento]
zona_temporal = "datos/temporal"
# Horas que se conservan los ficheros de un trabajo desde que termina (0 = no caducan).
# Un minijob puede fijar la suya con conservacion_horas en su manifiesto.
conservacion_horas = 6
# Cada cuánto se ejecuta la limpieza de ficheros caducados
limpieza_cada_minutos = 10

[trabajos]
# Cuántos trabajos pueden correr a la vez según el peso declarado por el minijob
max_ligeros = 4
max_pesados = 1
# Segundos que se espera a que un minijob pare por las buenas antes de cortarlo
gracia_cancelacion_s = 10

[subidas]
# Límites al subir ficheros desde el navegador
max_fichero_mb = 100
max_lote_mb = 2048
max_ficheros = 1000
