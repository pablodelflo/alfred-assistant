[project]
name = "alfred-assistant"
version = "0.1.0"
description = "Asistente personal doméstico con minijobs enchufables"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pillow-heif>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alfred*"]

[tool.setuptools.package-data]
"alfred.nucleo.web" = ["plantillas/*.html", "estaticos/*"]
"alfred.minijobs.conversor_medios" = ["manifiesto.toml"]
"alfred.nucleo.datos" = ["migraciones/script.py.mako", "migraciones/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
